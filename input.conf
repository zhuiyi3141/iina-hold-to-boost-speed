# Hold to Boost Speed —— 配套的 IINA 输入配置
#
# 安装方法（两选一）：
#   A. 自动：启用插件后，在插件设置页点「安装配套输入配置」按钮
#   B. 手动：把本文件拷到
#        ~/Library/Application Support/com.colliderli.iina/input_conf/holdspeed.conf
#      然后在 IINA「设置 → 快捷键 → 输入配置」里选择「holdspeed」，重启 IINA。
#
# 为什么需要它：
#   IINA 的 MainWindow.keyDown 第一件事是 menu?.performKeyEquivalent(with:)，而菜单项的
#   快捷键来自 PlayerCore.keyBindings。默认配置里的 `RIGHT seek 5` 会被挂到
#   「回放 → 渐进 5秒」菜单项的 key equivalent 上（实测 cmdChar = 63235 =
#   NSRightArrowFunctionKey）。于是方向键在 NSApplication 派发阶段就被菜单吃掉，
#   窗口收不到 keyDown，插件的 onKeyDown 永不会触发（keyUp 不走菜单，所以能到）。
#
# 与 IINA 默认配置的唯一区别：
#   `RIGHT seek 5`  → `RIGHT seek 5 keyframes`
#   `LEFT  seek -5` → `LEFT  seek -5 keyframes`
#
#   MenuController.sameKeyAction 在比对菜单项时只剥离 `relative` 和 `exact` 两个 flag，
#   `keyframes` 会被保留 → 不再匹配「渐进/渐退 5秒」菜单项 → 方向键落回窗口 → 插件生效。
#   而 `seek 5 keyframes` 本身仍是一条正常的 seek 绑定，行为与 `seek 5` 完全等价
#   （mpv 的 seek 默认按关键帧跳转；除非你把 hr-seek 设成 yes）。所以：
#
#       关掉本插件后，方向键会自动回到 IINA 原装的快进 / 快退，无需改回任何配置。
#
# ---------------------------------------------------------------------------

#@iina Shift+Meta+v video-panel
#@iina Shift+Meta+a audio-panel
#@iina Shift+Meta+s sub-panel

Ctrl+Meta+v cycle video
Ctrl+Meta+s cycle sub
Ctrl+Meta+a cycle audio

SPACE cycle pause
Meta+. stop

RIGHT seek 5 keyframes
LEFT  seek -5 keyframes
Alt+RIGHT frame-step
Alt+LEFT frame-back-step

Shift+LEFT   sub-seek -1
Shift+RIGHT  sub-seek  1

Meta+s screenshot

Meta+l ab-loop
Meta+L cycle-values loop "inf" "no"

#@iina Shift+Meta+p playlist-panel
Meta+RIGHT playlist-next
Meta+LEFT playlist-prev

#@iina Shift+Meta+c chapter-panel
Shift+Meta+> add chapter 1
Shift+Meta+< add chapter -1

Meta+[ multiply speed 0.5
Meta+] multiply speed 2.0
Alt+Meta+[ multiply speed 1/1.1
Alt+Meta+] multiply speed 1.1
Meta+\ set speed 1.0

Meta+0 set window-scale 0.5
Meta+1 set window-scale 1
Meta+2 set window-scale 2
#@iina Meta+3 fit-to-screen

#@iina Meta+- smaller-window
#@iina Meta+= bigger-window

#@iina Ctrl+Meta+p toggle-pip
#@iina Shift+Meta+r show-current-file-in-finder
Ctrl+Meta+f cycle fullscreen
Ctrl+Meta+t cycle ontop

#@iina Alt+Meta+m toggle-music-mode
#@iina Shift+Meta+t live-text

UP    add volume 5
DOWN  add volume -5
Alt+UP add volume 1
Alt+DOWN add volume -1

Meta+/ cycle mute

Shift+( add audio-delay 0.5
Shift+) add audio-delay -0.5
Alt+Shift+( add audio-delay 0.1
Alt+Shift+) add audio-delay -0.1
Shift+_ set audio-delay 0

#@iina Meta+D find-online-subs

Z add sub-delay -0.5
X add sub-delay 0.5
Alt+Z add sub-delay -0.1
Alt+X add sub-delay 0.1
C set sub-delay 0

ESC set fullscreen no
ENTER set fullscreen yes


# Alternative mpv key bindings

q quit

p cycle pause                          # toggle pause/playback mode

. frame-step                           # advance one frame and pause
, frame-back-step                      # go back by one frame and pause
o show-progress                        # show playback progress
P show-progress                        # show playback progress

m cycle mute

Shift+PGUP seek 600
Shift+PGDWN seek -600

G add sub-scale +0.1                   # increase the subtitle font size
F add sub-scale -0.1                   # decrease the subtitle font size

r add sub-pos -1
R add sub-pos +1
t add sub-pos +1
v cycle sub-visibility                 # hide or show the subtitles
Alt+v cycle secondary-sub-visibility   # hide or show the secondary subtitles

f cycle fullscreen                     # toggle fullscreen

E cycle edition                        # next edition

POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
PLAYONLY set pause no
PAUSEONLY set pause yes
STOP stop
FORWARD seek 15
REWIND seek -15
NEXT playlist-next
PREV playlist-prev
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
MUTE cycle mute
CLOSE_WIN quit
