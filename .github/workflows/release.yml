name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('Info.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          # 触发来源是 tag 就沿用 tag 名，否则用 v<version> 作为 tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack plugin
        run: |
          # .iinaplgz 本质是 zip；优先用 IINA 自带的 iina-plugin，没有就回退 zip
          PACKER="/Applications/IINA.app/Contents/MacOS/iina-plugin"
          OUT="hold-to-boost-speed-${{ steps.meta.outputs.version }}.iinaplgz"
          if [ -x "$PACKER" ]; then
            "$PACKER" pack .
            mv "$(ls -t *.iinaplgz | head -1)" "$OUT"
          else
            echo "::notice::本机未安装 IINA，改用 zip 打包（.iinaplgz 即为 zip 格式）"
            zip -r "$OUT" \
              Info.json main.js global.js pref.html input.conf README.md LICENSE
          fi
          ls -la "$OUT"
          unzip -l "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hold-to-boost-speed
          path: hold-to-boost-speed-*.iinaplgz

      - name: Create release
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: hold-to-boost-speed-*.iinaplgz
          generate_release_notes: true
          draft: false
          name: ${{ steps.meta.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
